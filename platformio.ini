; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pista_a_tanque

; ---- Base comun ----
[env]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.14.5
    adafruit/Adafruit TCS34725 @ ^1.4.4
    arduino-libraries/Servo @ ^1.2.2

; ---- Pista A: llantas tanque ----
[env:pista_a_tanque]
build_flags = -DPISTA_A -DCHASIS_TANQUE
build_src_filter = +<*> -<routines/pista2/>

; ---- Pista B: llantas mecanum ----
[env:pista_b_mecanum]
build_flags = -DPISTA_B -DCHASIS_MECANUM
build_src_filter = +<*> -<routines/pista1/>